version: '3.8'

services:
  hl-bot:
    build: .
    container_name: hl-terminal-bot
    restart: unless-stopped  # Auto restart kalau crash
    environment:
      - TOKEN=${TOKEN}
      - DEBUG=${DEBUG:-false}
      - HEALTHCHECK_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data      # Persistent data (db, json)
      - ./logs:/app/logs      # Log files
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits (opsional)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
