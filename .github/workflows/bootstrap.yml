name: Cryptone Bootstrap

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback days (7–90)'
        required: false
        default: '30'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Mkdir data
        run: mkdir -p ./data

      # Ambil DB dari run tertentu. Ganti run_id ke artifact sehat terakhir jika perlu.
      - name: Download DB
        uses: dawidd6/action-download-artifact@v6
        with:
          name: cryptone-db
          path: ./data/artifact_dl
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: 44551429374
          if_no_artifact_found: fail

      - name: Siapkan DB dan cek integritas
        id: prep
        run: |
          mkdir -p ./data
          SRC=$(find ./data/artifact_dl -name 'cryptone_v45.db' -type f | head -1)
          if [ -z "$SRC" ]; then echo "ABORT: cryptone_v45.db tidak ditemukan di artifact"; exit 1; fi
          cp "$SRC" ./data/cryptone_v45.db
          python - <<'PY'
          import sqlite3, sys
          c = sqlite3.connect("./data/cryptone_v45.db")
          row = c.execute("PRAGMA integrity_check").fetchone()
          print("integrity_check:", row)
          if not row or row[0] != "ok":
              print("ABORT: integrity_check bukan ok, bootstrap tidak dijalankan")
              sys.exit(1)
          n = c.execute("SELECT COUNT(*) FROM signal_history").fetchone()[0]
          print("pre-bootstrap signal_history =", n)
          c.close()
          open("pre_count.txt", "w").write(str(n))
          PY

      - name: Bootstrap history
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRYPTONE_DB_PATH: ./data/cryptone_v45.db
        run: |
          DAYS="${{ github.event.inputs.days || '30' }}"
          python cryptone_v45.py --bootstrap --days "$DAYS"
          python -c "import sqlite3;c=sqlite3.connect('./data/cryptone_v45.db');print('meta',c.execute('SELECT * FROM bootstrap_meta').fetchall());print('fund',c.execute('SELECT COUNT(*) FROM metric_funding').fetchone()[0]);print('atr',c.execute('SELECT COUNT(*) FROM metric_atr').fetchone()[0]);print('signals',c.execute('SELECT COUNT(*) FROM signal_history').fetchone()[0]);print('resolved',c.execute(\"SELECT COUNT(*) FROM signal_history WHERE outcome IS NOT NULL\").fetchone()[0]);c.close()"

      - name: Guard hasil sebelum upload
        id: post
        if: success()
        run: |
          python - <<'PY'
          import sqlite3, sys
          pre = int(open("pre_count.txt").read().strip() or 0)
          c = sqlite3.connect("./data/cryptone_v45.db")
          row = c.execute("PRAGMA integrity_check").fetchone()
          n = c.execute("SELECT COUNT(*) FROM signal_history").fetchone()[0]
          c.close()
          print("post signal_history =", n, "pre =", pre, "integrity =", row)
          if not row or row[0] != "ok" or n < pre:
              print("ABORT: hasil bootstrap mencurigakan, tidak diupload")
              sys.exit(1)
          PY
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Upload DB
        if: success() && steps.post.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cryptone-db
          path: ./data/cryptone_v45.db
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
          
