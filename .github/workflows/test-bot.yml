name: Test Bot Scan

on:
  workflow_dispatch:

jobs:
  test-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run single scan
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "TOKEN length: ${#TOKEN}"  # Debug: cek token ada
          python << 'EOF'
import os
import sys

# Force set environment variable
token = os.environ.get('TOKEN')
if not token:
    # Try to get from different method
    token = os.environ.get('TELEGRAM_BOT_TOKEN')
    
if not token:
    print("❌ No token found in environment")
    print("Available env vars:", list(os.environ.keys()))
    sys.exit(1)

print(f"✅ Token found, length: {len(token)}")

# Set TOKEN explicitly
os.environ['TOKEN'] = token

# Now import and run bot module
import time

# Read bot.py content and execute
with open('bot.py', 'r') as f:
    bot_code = f.read()

exec(bot_code)

print("🚀 Running entry alert scan...")
try:
    check_entry_alert()
    print("✅ Entry alert scan done")
except Exception as e:
    print(f"❌ Entry alert error: {e}")

print("🚀 Running squeeze alert scan...")
try:
    check_squeeze_alert()
    print("✅ Squeeze alert scan done")
except Exception as e:
    print(f"❌ Squeeze alert error: {e}")

print("🚀 Running warroom scan...")
try:
    check_warroom_simple()
    print("✅ Warroom scan done")
except Exception as e:
    print(f"❌ Warroom error: {e}")
EOF
