name: Bot

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      
      - name: Debug token
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "✅ Token exists (length: ${#TOKEN})"
          else
            echo "❌ Token NOT found in secrets!"
          fi
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      
      - name: Run bot
        run: python bot.py
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_ACTIONS: "true"
