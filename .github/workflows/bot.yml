name: HL Terminal Bot v4.0

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: hl-terminal-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 21

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore persistent state
        uses: actions/cache/restore@v4
        with:
          path: |
            oi_history_persist.json
            learning_data.json
            predictions.json
            wallet_tracker_state.json
            best_params.json
            bot_data.db
          key: bot-state-${{ github.run_number }}
          restore-keys: |
            bot-state-

      - name: Run bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          timeout 1140 python bot.py || true

      - name: Save persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            oi_history_persist.json
            learning_data.json
            predictions.json
            wallet_tracker_state.json
            best_params.json
            bot_data.db
          key: bot-state-${{ github.run_number }}
