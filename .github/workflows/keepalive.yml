name: Keep-Alive

on:
  schedule:
    # 1 & 15 tiap bulan — cegah auto-pause 60 hari tanpa commit
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Keep-alive commit
        run: |
          git config user.email "bot@cryptone.local"
          git config user.name "Cryptone Bot"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .keepalive
          git add .keepalive
          git commit -m "keepalive $(date -u +%Y-%m-%d)" || true
          git push origin HEAD:main || true
