name: Cryptone Live

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: cryptone-live
  # true = 1 Live at a time. Parallel Live → same bootstrap DB → re-fire spam
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Mkdir data
        run: mkdir -p ./data

      - name: Download DB
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: cryptone-db
          path: ./data
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow_search: true
          search_artifacts: true
          check_artifacts: true
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: Normalize DB path
        run: |
          echo "=== tree ./data ==="
          find ./data -type f 2>/dev/null | head -40 || true
          if [ ! -f ./data/cryptone_v45.db ]; then
            FOUND=$(find ./data -name 'cryptone_v45.db' -type f 2>/dev/null | head -1 || true)
            if [ -n "$FOUND" ]; then
              echo "Moving $FOUND -> ./data/cryptone_v45.db"
              mkdir -p ./data
              mv "$FOUND" ./data/cryptone_v45.db
            else
              echo "No DB file after download — will auto-bootstrap in bot"
            fi
          fi
          if [ -f ./data/cryptone_v45.db ]; then
            ls -la ./data/cryptone_v45.db
            python -c "import sqlite3;c=sqlite3.connect('./data/cryptone_v45.db');t=[r[0] for r in c.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")];print('tables:',sorted(t));print('bootstrap_meta:',c.execute('SELECT bootstrapped_at,bootstrap_days FROM bootstrap_meta WHERE id=1').fetchone() if 'bootstrap_meta' in t else 'ABSENT');print('funding:',c.execute('SELECT COUNT(*) FROM metric_funding').fetchone()[0] if 'metric_funding' in t else 0);print('atr:',c.execute('SELECT COUNT(*) FROM metric_atr').fetchone()[0] if 'metric_atr' in t else 0);c.close()"
          else
            echo "No DB file after download — will auto-bootstrap in bot"
          fi

      - name: Run bot 5.5 jam
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CRYPTONE_TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTONE_TELEGRAM_BOT_TOKEN }}
          CRYPTONE_OPERATOR_CHAT_ID: ${{ secrets.CRYPTONE_OPERATOR_CHAT_ID }}
          CRYPTONE_USER_CHAT_ID: ${{ secrets.CRYPTONE_USER_CHAT_ID }}
          CRYPTONE_EXCHANGE_WALLETS: ${{ secrets.CRYPTONE_EXCHANGE_WALLETS }}
          CRYPTONE_PINNED_SYMBOLS: ""
          CRYPTONE_DB_PATH: ./data/cryptone_v45.db
          CRYPTONE_CYCLE_INTERVAL_SEC: "300"
          CRYPTONE_MAX_RUNTIME_SEC: "19800"
          CRYPTONE_AUTO_BOOTSTRAP_DAYS: "14"
        run: |
          python cryptone_v45.py --live --max-runtime 19800

      - name: Upload DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptone-db
          path: ./data/cryptone_v45.db
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
