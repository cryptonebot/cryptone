name: Cryptone Live

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: cryptone-live
  # true = 1 Live at a time. Parallel Live → same bootstrap DB → re-fire spam.
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Mkdir data
        run: mkdir -p ./data

      # 1) Cache restore (cepat, survive cancel lebih baik dari artifact success-only)
      - name: Restore DB cache
        id: cache-db
        uses: actions/cache/restore@v4
        with:
          path: |
            ./data/cryptone_v45.db
            ./data/cryptone_v45.db-wal
            ./data/cryptone_v45.db-shm
          key: cryptone-db-v45-${{ github.run_id }}
          restore-keys: |
            cryptone-db-v45-

      # 2) Artifact: conclusion=completed (success|cancelled|failure yang sempat upload)
      #    JANGAN success-only — cancel Live tetap bisa bawa signal_history.
      - name: Download DB artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: cryptone-db
          path: ./data/artifact_dl
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow_search: true
          search_artifacts: true
          check_artifacts: true
          workflow_conclusion: completed
          if_no_artifact_found: warn

      - name: Merge DB sources (cache vs artifact — pilih yang lebih kaya)
        run: |
          mkdir -p ./data
          python - <<'PY'
          import os, shutil, sqlite3
          from pathlib import Path

          def score(path: Path) -> tuple:
              if not path.is_file() or path.stat().st_size < 1024:
                  return (-1, 0, 0, 0)
              try:
                  c = sqlite3.connect(str(path))
                  def n(q):
                      try:
                          return int((c.execute(q).fetchone() or [0])[0])
                      except Exception:
                          return 0
                  t = [r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")]
                  sig = n("SELECT COUNT(*) FROM signal_history") if "signal_history" in t else 0
                  res = n("SELECT COUNT(*) FROM signal_history WHERE outcome IS NOT NULL") if "signal_history" in t else 0
                  fund = n("SELECT COUNT(*) FROM metric_funding") if "metric_funding" in t else 0
                  atr = n("SELECT COUNT(*) FROM metric_atr") if "metric_atr" in t else 0
                  c.close()
                  # prioritas: resolved outcomes > signals > fund+atr
                  return (res, sig, fund + atr, path.stat().st_size)
              except Exception as e:
                  print("score fail", path, e)
                  return (-1, 0, 0, 0)

          candidates = []
          for p in [
              Path("./data/cryptone_v45.db"),  # cache restore
              *Path("./data/artifact_dl").rglob("cryptone_v45.db") if Path("./data/artifact_dl").exists() else [],
          ]:
              if p.is_file():
                  candidates.append(p)

          if not candidates:
              print("NO DB from cache or artifact — bot will auto-bootstrap")
              raise SystemExit(0)

          ranked = sorted(((score(p), p) for p in candidates), key=lambda x: x[0], reverse=True)
          for sc, p in ranked:
              print(f"candidate {p} score={sc}")
          best_sc, best = ranked[0]
          dest = Path("./data/cryptone_v45.db")
          if best.resolve() != dest.resolve():
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(best, dest)
              print(f"SELECTED {best} -> {dest} score={best_sc}")
          else:
              print(f"SELECTED cache DB score={best_sc}")

          c = sqlite3.connect(str(dest))
          c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          def n(q):
              try:
                  return int((c.execute(q).fetchone() or [0])[0])
              except Exception:
                  return 0
          t = [r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")]
          print("FINAL tables", sorted(t))
          print("FINAL signals", n("SELECT COUNT(*) FROM signal_history") if "signal_history" in t else 0)
          print("FINAL resolved", n("SELECT COUNT(*) FROM signal_history WHERE outcome IS NOT NULL") if "signal_history" in t else 0)
          print("FINAL funding", n("SELECT COUNT(*) FROM metric_funding") if "metric_funding" in t else 0)
          print("FINAL atr", n("SELECT COUNT(*) FROM metric_atr") if "metric_atr" in t else 0)
          print("FINAL oi", n("SELECT COUNT(*) FROM metric_oi") if "metric_oi" in t else 0)
          c.close()
          PY

      - name: Run bot 5.5 jam
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CRYPTONE_TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTONE_TELEGRAM_BOT_TOKEN }}
          CRYPTONE_OPERATOR_CHAT_ID: ${{ secrets.CRYPTONE_OPERATOR_CHAT_ID }}
          CRYPTONE_USER_CHAT_ID: ${{ secrets.CRYPTONE_USER_CHAT_ID }}
          CRYPTONE_EXCHANGE_WALLETS: ${{ secrets.CRYPTONE_EXCHANGE_WALLETS }}
          CRYPTONE_PINNED_SYMBOLS: ""
          CRYPTONE_DB_PATH: ./data/cryptone_v45.db
          CRYPTONE_CYCLE_INTERVAL_SEC: "300"
          CRYPTONE_MAX_RUNTIME_SEC: "19800"
          CRYPTONE_AUTO_BOOTSTRAP_DAYS: "14"
        run: |
          python cryptone_v45.py --live --max-runtime 19800

      - name: Checkpoint DB
        if: always()
        run: |
          if [ -f ./data/cryptone_v45.db ]; then
            python -c 'import sqlite3,os;p="./data/cryptone_v45.db";c=sqlite3.connect(p);c.execute("PRAGMA wal_checkpoint(TRUNCATE)");c.close();print("checkpoint ok size",os.path.getsize(p));c=sqlite3.connect(p);n=lambda q:(c.execute(q).fetchone() or [0])[0];print("signals",n("SELECT COUNT(*) FROM signal_history"));print("resolved",n("SELECT COUNT(*) FROM signal_history WHERE outcome IS NOT NULL"));print("oi",n("SELECT COUNT(*) FROM metric_oi"));print("fund",n("SELECT COUNT(*) FROM metric_funding"));c.close()'
          else
            echo "No DB to checkpoint"
          fi

      - name: Upload DB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptone-db
          path: ./data/cryptone_v45.db
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ./data/cryptone_v45.db
          key: cryptone-db-v45-${{ github.run_id }}
