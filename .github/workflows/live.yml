name: Cryptone Live

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: cryptone-live
  # true = 1 Live at a time. Parallel Live → same bootstrap DB → re-fire spam.
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # FIX #4: naikkan timeout ke 360m (max hosted runner) supaya bot 330m
    # masih punya ~30m buffer untuk install, restore, merge, .recover, upload, cache.
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # Safety: sqlite3 CLI untuk .recover. Biasanya sudah ada di ubuntu-latest,
      # step ini idempotent kalau memang sudah terpasang.
      - name: Ensure sqlite3 CLI
        run: |
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update && sudo apt-get install -y sqlite3
          fi
          sqlite3 --version

      # FIX #7: Mkdir data SEBELUM cache restore supaya path selalu ada.
      - name: Mkdir data
        run: mkdir -p ./data

      # 1) Cache restore (cepat, survive cancel lebih baik dari artifact success-only)
      - name: Restore DB cache
        id: cache-db
        uses: actions/cache/restore@v4
        with:
          path: |
            ./data/cryptone_v45.db
            ./data/cryptone_v45.db-wal
            ./data/cryptone_v45.db-shm
          key: cryptone-db-v45-${{ github.run_id }}
          restore-keys: |
            cryptone-db-v45-

      # 2a) Pin recovery: Cryptone Live #323 (run_id 44551429374).
      #     Per 20/11: #323 terbukti corrupt (integrity != ok). Tetap di-download
      #     supaya bisa dipakai sebagai sumber .recover, tapi tidak akan dipilih
      #     selama ada kandidat yang integrity ok.
      - name: Download DB pin recovery (#323)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: cryptone-db
          path: ./data/artifact_pin
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: 44551429374
          if_no_artifact_found: warn

      # 2b) Artifact lain (completed). Merge mengutamakan integrity=ok.
      # FIX #10: batasi ke branch aktif (default branch pada schedule) supaya
      # tidak kontaminasi dari PR/fork/feature branch lain.
      - name: Download DB artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: cryptone-db
          path: ./data/artifact_dl
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow_search: true
          search_artifacts: true
          check_artifacts: true
          workflow_conclusion: completed
          branch: ${{ github.ref_name }}
          if_no_artifact_found: warn

      - name: Merge DB sources (cache vs artifact — pilih yang lebih kaya)
        env:
          # FIX #11: default "0" = abort kalau tidak ada DB sama sekali dan
          # tidak ada indikasi history. Set "1" HANYA untuk first-run bootstrap.
          CRYPTONE_MERGE_ALLOW_BOOTSTRAP: "0"
        run: |
          python <<'PY'
          import os
          import re
          import shutil
          import sqlite3
          from pathlib import Path

          def score(path: Path):
              # Tuple: (integrity_ok, resolved, signals, metrics, size)
              # integrity_ok diutamakan — DB corrupt 12k sinyal kalah dari DB sehat 10k.
              if not path.is_file() or path.stat().st_size < 1024:
                  return (0, -1, 0, 0, 0)
              try:
                  c = sqlite3.connect(str(path))
                  def n(q):
                      try:
                          return int((c.execute(q).fetchone() or [0])[0])
                      except Exception:
                          return 0
                  try:
                      ic = c.execute("PRAGMA integrity_check").fetchone()
                      ok = 1 if (ic and ic[0] == "ok") else 0
                  except Exception:
                      ok = 0
                  tables = {
                      r[0]
                      for r in c.execute(
                          "SELECT name FROM sqlite_master WHERE type='table'"
                      )
                  }
                  sig = n("SELECT COUNT(*) FROM signal_history") if "signal_history" in tables else 0
                  res = (
                      n("SELECT COUNT(*) FROM signal_history WHERE outcome IS NOT NULL")
                      if "signal_history" in tables
                      else 0
                  )
                  fund = n("SELECT COUNT(*) FROM metric_funding") if "metric_funding" in tables else 0
                  atr = n("SELECT COUNT(*) FROM metric_atr") if "metric_atr" in tables else 0
                  c.close()
                  return (ok, res, sig, fund + atr, path.stat().st_size)
              except Exception as e:
                  print("score fail", path, type(e).__name__, e)
                  return (0, -1, 0, 0, 0)

          candidates = []
          pin_root = Path("./data/artifact_pin")
          if pin_root.exists():
              candidates.extend(pin_root.rglob("cryptone_v45.db"))
          cache_db = Path("./data/cryptone_v45.db")
          if cache_db.is_file():
              candidates.append(cache_db)
          art_root = Path("./data/artifact_dl")
          if art_root.exists():
              candidates.extend(art_root.rglob("cryptone_v45.db"))

          if not candidates:
              allow = os.environ.get("CRYPTONE_MERGE_ALLOW_BOOTSTRAP", "0") == "1"
              if allow:
                  print("NO DB — bootstrap allowed, bot akan auto-bootstrap")
                  raise SystemExit(0)
              print("ABORT merge: NO DB from cache or artifact and bootstrap disallowed")
              print("  → Set CRYPTONE_MERGE_ALLOW_BOOTSTRAP=1 untuk first-run bootstrap yang sah.")
              raise SystemExit(1)

          ranked = sorted(
              ((score(p), p) for p in candidates),
              key=lambda x: x[0],
              reverse=True,
          )
          for sc, p in ranked:
              print(f"candidate {p} score={sc}")

          best_sc, best = ranked[0]
          dest = Path("./data/cryptone_v45.db")
          dest.parent.mkdir(parents=True, exist_ok=True)
          if best.resolve() != dest.resolve():
              shutil.copy2(best, dest)
              print(f"SELECTED {best} -> {dest} score={best_sc}")
          else:
              print(f"SELECTED cache DB score={best_sc}")

          c = sqlite3.connect(str(dest))
          try:
              c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          except Exception:
              pass

          def n(q):
              try:
                  return int((c.execute(q).fetchone() or [0])[0])
              except Exception:
                  return 0

          tables = {
              r[0]
              for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")
          }
          try:
              ic = c.execute("PRAGMA integrity_check").fetchone()
              ic_ok = bool(ic and ic[0] == "ok")
          except Exception:
              ic_ok = False
          sig_n = n("SELECT COUNT(*) FROM signal_history") if "signal_history" in tables else 0
          print("FINAL tables", sorted(tables))
          print("FINAL integrity", "ok" if ic_ok else "CORRUPT")
          print("FINAL signals", sig_n)
          print(
              "FINAL resolved",
              n("SELECT COUNT(*) FROM signal_history WHERE outcome IS NOT NULL")
              if "signal_history" in tables
              else 0,
          )
          print(
              "FINAL funding",
              n("SELECT COUNT(*) FROM metric_funding") if "metric_funding" in tables else 0,
          )
          print(
              "FINAL atr",
              n("SELECT COUNT(*) FROM metric_atr") if "metric_atr" in tables else 0,
          )
          print(
              "FINAL oi",
              n("SELECT COUNT(*) FROM metric_oi") if "metric_oi" in tables else 0,
          )
          c.close()
          if ic_ok:
              print("MERGE integrity ok — lanjut")
          elif sig_n > 0 or dest.stat().st_size >= 1_000_000:
              print(
                  "MERGE candidate CORRUPT · mencoba sqlite3 .recover "
                  "(pin #323 / artifact terbaru sama-sama rusak)"
              )
              import subprocess
              src = dest
              recovered = Path("./data/cryptone_v45_recovered.db")
              if recovered.exists():
                  recovered.unlink()
              proc = subprocess.run(
                  ["sqlite3", str(src), ".recover"],
                  capture_output=True,
                  text=True,
                  timeout=600,
              )
              # FIX #6: filter sqlite_sequence pakai regex prefix (bukan substring)
              # supaya tidak buang baris data yang mengandung kata itu.
              seq_pat = re.compile(
                  r'^\s*(?:'
                  r'CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?sqlite_sequence\b'
                  r'|INSERT\s+INTO\s+sqlite_sequence\b'
                  r'|DELETE\s+FROM\s+sqlite_sequence\b'
                  r'|DROP\s+TABLE\s+(?:IF\s+EXISTS\s+)?sqlite_sequence\b'
                  r')',
                  re.I,
              )
              dump = "".join(
                  line for line in proc.stdout.splitlines(True)
                  if not seq_pat.match(line)
              )
              if proc.returncode != 0 and not dump:
                  print("recover stderr:", (proc.stderr or "")[:500])
                  print("ABORT merge: .recover gagal")
                  raise SystemExit(1)
              proc2 = subprocess.run(
                  ["sqlite3", str(recovered)],
                  input=dump,
                  capture_output=True,
                  text=True,
                  timeout=600,
              )
              if proc2.returncode != 0:
                  print("recover apply stderr:", (proc2.stderr or "")[:500])
                  print("ABORT merge: apply .recover gagal")
                  raise SystemExit(1)
              c2 = sqlite3.connect(str(recovered))
              try:
                  row = c2.execute("PRAGMA integrity_check").fetchone()
                  ok2 = bool(row and row[0] == "ok")
                  try:
                      n2 = int(c2.execute("SELECT COUNT(*) FROM signal_history").fetchone()[0])
                  except Exception:
                      n2 = -1
              finally:
                  c2.close()
              print("RECOVERED integrity:", "ok" if ok2 else row)
              print("RECOVERED signals:", n2)
              if not ok2 or n2 <= 0:
                  print("ABORT merge: recovered masih jelek")
                  raise SystemExit(1)
              shutil.copy2(recovered, dest)
              print(f"RECOVERED -> {dest} signals={n2}")
          else:
              print("MERGE: no usable DB (empty/corrupt kecil)")
          PY

      - name: Guard integrity sebelum bot
        id: guard
        run: |
          python <<'PY'
          import sqlite3, sys
          from pathlib import Path
          p = Path("./data/cryptone_v45.db")
          if not p.is_file():
              print("NO DB file — bot may auto-bootstrap if allowed")
              open("guard_signals.txt","w").write("0")
              sys.exit(0)
          c = sqlite3.connect(str(p))
          try:
              row = c.execute("PRAGMA integrity_check").fetchone()
              print("integrity_check:", row[0] if row else None)
              try:
                  n = int(c.execute("SELECT COUNT(*) FROM signal_history").fetchone()[0])
              except Exception as e:
                  print("COUNT fail:", type(e).__name__)
                  n = -1
              print("signals:", n, "size_mb:", round(p.stat().st_size/1e6, 2))
              open("guard_signals.txt","w").write(str(n))
              if not row or row[0] != "ok":
                  if n != 0 or p.stat().st_size >= 1_000_000:
                      print("ABORT: DB corrupt dengan indikasi history — perbaiki artifact dulu")
                      sys.exit(1)
                  print("WARN: corrupt kecil tanpa history — bot boleh fresh")
          finally:
              c.close()
          PY

      - name: Run bot 5.5 jam
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CRYPTONE_TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTONE_TELEGRAM_BOT_TOKEN }}
          CRYPTONE_OPERATOR_CHAT_ID: ${{ secrets.CRYPTONE_OPERATOR_CHAT_ID }}
          CRYPTONE_USER_CHAT_ID: ${{ secrets.CRYPTONE_USER_CHAT_ID }}
          CRYPTONE_EXCHANGE_WALLETS: ${{ secrets.CRYPTONE_EXCHANGE_WALLETS }}
          CRYPTONE_PINNED_SYMBOLS: ""
          CRYPTONE_DB_PATH: ./data/cryptone_v45.db
          CRYPTONE_CYCLE_INTERVAL_SEC: "300"
          CRYPTONE_MAX_RUNTIME_SEC: "19800"
          CRYPTONE_AUTO_BOOTSTRAP_DAYS: "0"
        run: |
          python cryptone_v45.py --live --max-runtime 19800

      - name: Checkpoint DB
        if: always()
        run: |
          if [ -f ./data/cryptone_v45.db ]; then
            python -c 'import sqlite3,os;p="./data/cryptone_v45.db";c=sqlite3.connect(p);c.execute("PRAGMA wal_checkpoint(TRUNCATE)");c.close();print("checkpoint ok size",os.path.getsize(p));c=sqlite3.connect(p);n=lambda q:(c.execute(q).fetchone() or [0])[0];print("signals",n("SELECT COUNT(*) FROM signal_history"));print("resolved",n("SELECT COUNT(*) FROM signal_history WHERE outcome IS NOT NULL"));print("oi",n("SELECT COUNT(*) FROM metric_oi"));print("fund",n("SELECT COUNT(*) FROM metric_funding"));c.close()'
          else
            echo "No DB to checkpoint"
          fi

      # FIX #1: gate jadi output step (selalu exit 0), upload/cache diputuskan
      # dari output ini — bukan dari success(), supaya gate yang "no" tidak
      # mematikan upload ketika DB sebenarnya sehat tapi step lain gagal.
      - name: Upload gate
        id: upload_gate
        if: always()
        run: |
          python <<'PY'
          import os, sqlite3
          from pathlib import Path
          p = Path("./data/cryptone_v45.db")
          ok = False
          reason = "no_db"
          if p.is_file():
              c = sqlite3.connect(str(p))
              try:
                  row = c.execute("PRAGMA integrity_check").fetchone()
                  try:
                      n = int(c.execute("SELECT COUNT(*) FROM signal_history").fetchone()[0])
                  except Exception:
                      n = -1
                  integ_ok = bool(row and row[0] == "ok")
                  print(f"upload_gate integrity={row} signals={n}")
                  if not integ_ok:
                      reason = "corrupt"
                  elif n <= 0:
                      reason = "signals_zero"
                  else:
                      ok = True
                      reason = "ok"
              finally:
                  c.close()
          print(f"upload_gate ok={ok} reason={reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
              f.write(f"reason={reason}\n")
          PY

      - name: Upload DB artifact
        if: always() && steps.upload_gate.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cryptone-db
          path: ./data/cryptone_v45.db
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6

      - name: Save DB cache (hanya DB sehat)
        if: always() && steps.upload_gate.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ./data/cryptone_v45.db
          key: cryptone-db-v45-${{ github.run_id }}
