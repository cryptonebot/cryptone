name: Run Bot (Cron)

on:
  schedule:
    - cron: '*/20 * * * *'  # Setiap 20 menit
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Maks 15 menit per run
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot (single scan)
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEBUG: false
          GITHUB_ACTIONS: true
        run: |
          python -c "
          import os
          os.environ['GITHUB_ACTIONS'] = 'true'
          exec(open('bot.py').read())
          " &
          sleep 300  # Jalan 5 menit, cukup untuk 1 scan
          pkill -f bot.py || true
