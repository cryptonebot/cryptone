name: Health Check

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot health
        uses: actions/checkout@v4
      
      - name: Ping bot health endpoint
        run: |
          # Ganti dengan URL VPS atau service kamu
          curl -f https://your-domain.com/health || echo "Bot down!"
